<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark" data-accent="navy">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CYVEX</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="splash" class="splash">
    <div class="splash-mark">
      <img src="logo.png" width="88" height="88" alt="" />
    </div>
    <div class="splash-name">CYVEX</div>
    <div class="splash-bar"><span></span></div>
  </div>

  <div id="titlebar" class="titlebar" hidden>
    <div class="tb-brand pywebview-drag-region">
      <img src="logo.png" width="20" height="20" alt="" />
      <span>CYVEX</span>
    </div>
    <div class="tb-spacer pywebview-drag-region"></div>
    <div class="tb-controls">
      <button class="tb-btn" data-win="minimize" aria-label="minimize"><svg viewBox="0 0 12 12"><rect x="2" y="5.4" width="8" height="1.2" fill="currentColor"/></svg></button>
      <button class="tb-btn" data-win="maximize" aria-label="maximize"><svg viewBox="0 0 12 12"><rect x="2.2" y="2.2" width="7.6" height="7.6" fill="none" stroke="currentColor" stroke-width="1.1"/></svg></button>
      <button class="tb-btn close" data-win="close" aria-label="close"><svg viewBox="0 0 12 12"><path d="M2.8 2.8l6.4 6.4M9.2 2.8l-6.4 6.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
    </div>
  </div>

  <div id="app" class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <img src="logo.png" width="32" height="32" alt="" />
        </div>
        <div class="brand-text">
          <span class="brand-name">CYVEX</span>
          <span class="brand-sub">Security</span>
        </div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <span id="status-dot" class="dot"></span>
        <span id="foot-status">—</span>
        <span class="spacer"></span>
        <span id="app-version"></span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button id="sidebar-toggle" class="ghost-btn icon" title="menu" aria-label="menu"></button>
          <div class="topbar-title" id="view-title">—</div>
        </div>
        <div class="topbar-actions">
          <div class="bell-wrap">
            <button id="bell" class="ghost-btn icon" title="notifications" aria-label="notifications">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>
              </svg>
              <span id="bell-dot" class="bell-dot" hidden></span>
            </button>
            <div id="notif-panel" class="notif-panel" hidden></div>
          </div>
          <button id="lang-toggle" class="ghost-btn" title="Language">EN</button>
          <button id="theme-toggle" class="ghost-btn icon" title="Theme" aria-label="theme"></button>
          <div id="status-pill" class="status-pill"></div>
        </div>
      </header>
      <section id="view" class="view" tabindex="-1"></section>
    </main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script>
    window.__errs = [];
    window.addEventListener("error", (e) => window.__errs.push(String(e.message || e)));
    window.addEventListener("unhandledrejection", (e) => window.__errs.push("promise: " + String(e.reason)));
  </script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
